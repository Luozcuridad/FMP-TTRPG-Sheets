<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FMP CIVILIANs Character Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
</head>

<body class="theme-green">

  <!-- Buttons above the sheet. They are hidden when printing. -->
  <div class="toolbar no-print">
    <a class="button" href="index.html">Home</a>
    <button id="btn-clear">New character</button>
    <button id="btn-print">Print as PDF</button>
    <button id="btn-png">Save as PNG</button>
  </div>

  <main class="sheet">

    <!-- Put a file named logo.png next to this page to replace the text placeholder -->
    <div class="logo">
      <img src="logo.png" alt="French Maid Planet"
        onerror="this.parentElement.classList.add('no-logo'); this.remove();">
    </div>

    <h1 class="title">CIVILIANs</h1>

    <!-- LEFT COLUMN -->
    <section class="left">

      <div class="fields">
        <label class="line"><span>NAME:</span><input id="name" type="text"></label>
        <label class="line"><span>SPECIES:</span><input id="species" type="text"></label>
        <label class="line"><span>JOB:</span><input id="job" type="text"></label>
        <label class="line"><span>MOTIVATION:</span><input id="motivation" type="text"></label>
        <label class="line"><span>FLAWS:</span><input id="flaws" type="text"></label>
      </div>

      <!-- Six stats: top box and bottom box for each of the three columns -->
      <div class="stats">
        <div class="stat">
          <h3>Stat 1</h3>
          <input id="weapon" type="number" min="0" placeholder="00">
          <input id="rally" type="number" min="0" placeholder="00">
          <h3>Stat 2</h3>
        </div>
        <div class="stat">
          <h3>Stat 3</h3>
          <input id="evasion" type="number" min="0" placeholder="00">
          <input id="strength" type="number" min="0" placeholder="00">
          <h3>Stat 4</h3>
        </div>
        <div class="stat">
          <h3>Stat 5</h3>
          <input id="strategy" type="number" min="0" placeholder="00">
          <input id="willpower" type="number" min="0" placeholder="00">
          <h3>Stat 6</h3>
        </div>
      </div>

      <!-- The 20 checkboxes are created by script.js from a list -->
      <div class="skills" id="skills"></div>

    </section>

    <!-- RIGHT COLUMN -->
    <section class="right">

      <div class="portrait" id="portrait" tabindex="0" role="button" aria-label="Choose a portrait image">
        <span class="hint no-print">Click or drop an image here</span>
        <img id="portrait-img" alt="Character portrait" hidden>
      </div>

      <div class="box">
        <h3>EQUIPMENT</h3>
        <textarea id="equipment"></textarea>
      </div>

      <div class="box tall">
        <h3>ITEMS</h3>
        <textarea id="items"></textarea>
      </div>

      <label class="tokens"><span>ADVERSITY TOKENS:</span><input id="tokens" type="number" min="0"></label>

    </section>

  </main>

  <!-- Hidden file picker used by the portrait box -->
  <input type="file" id="portrait-file" accept="image/*" hidden>

  <script>
    window.SHEET = {
      key: "fmp-civilian-sheet",
      skills: ["Skill 1", "Skill 2", "Skill 3", "Skill 4", "Skill 5", "Skill 6", "Skill 7", "Skill 8", "Skill 9", "Skill 10", "Skill 11", "Skill 12", "Skill 13", "Skill 14", "Skill 15", "Skill 16", "Skill 17", "Skill 18", "Skill 19", "Skill 20"]
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
